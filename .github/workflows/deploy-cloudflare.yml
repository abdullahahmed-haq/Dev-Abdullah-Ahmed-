name: Deploy Cloudflare preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SITE_ORIGIN: https://my-profile-next-preview.odd-andesaurus.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify Cloudflare Worker access
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/services/my-profile-next-preview" \
            > /dev/null
      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify and build the Worker
        run: npm run verify
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.preview.jsonc
      - name: Smoke-test the public deployment
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$NEXT_PUBLIC_SITE_ORIGIN/en" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$NEXT_PUBLIC_SITE_ORIGIN/ar" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors "$NEXT_PUBLIC_SITE_ORIGIN/robots.txt" | grep --fixed-strings "$NEXT_PUBLIC_SITE_ORIGIN"
      - name: Report missing deployment credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Cloudflare deployment is ready but waiting for the repository deployment secrets."
